name: Aurora-Kernel

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Kernel branch to build'
        required: true
        default: '4.9.337'
        type: choice
        options:
          - 4.9.337
          - SDM632-WIP
      with_ksu:
        description: 'Include ReSukiSU (root)?'
        required: true
        default: false
        type: boolean
      ksu_ref:
        description: 'ReSukiSU version (branch, tag or commit). E.g. main'
        required: false
        default: 'main'
        type: string

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      DEVICE: sanders
      DEVICE_NAME: Moto G5s Plus
      KERNEL_NAME: Aurora Kernel

    steps:
      - name: Check Out (${{ inputs.branch }})
        uses: actions/checkout@v3
        with:
          ref: ${{ inputs.branch }}

      - name: Set Timezone
        uses: szenius/set-timezone@v1.2
        with:
          timezoneLinux: "America/Sao_Paulo"

      - name: Setting up the environment
        run: |
          sudo apt-get update -y
          sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Set Build Start Time
        run: echo "START_TIME=$(date +%s)" >> $GITHUB_ENV

      - name: Run build script
        env:
          WITH_KSU: ${{ inputs.with_ksu && '1' || '0' }}
          KSU_REF: ${{ inputs.ksu_ref }}
        run: |
          echo "Branch: ${{ inputs.branch }} | WITH_KSU=$WITH_KSU | KSU_REF=$KSU_REF"
          ./build.sh

      - name: Set Build End Time
        run: echo "END_TIME=$(date +%s)" >> $GITHUB_ENV

      - name: Calculate Build Duration
        run: |
          duration=$((END_TIME - START_TIME))
          minutes=$((duration / 60))
          seconds=$((duration % 60))
          echo "BUILD_DURATION=${minutes}m ${seconds}s" >> $GITHUB_ENV

      - name: Upload to Telegram
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.TELEGRAM_CHAT_ID }}
          token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          document: Aurora-Kernel-sanders*.zip
          message: |
            🌌 New Aurora Kernel build available!
            📱 Device: Moto G5s Plus (sanders)
            🌿 Branch: ${{ inputs.branch }}
            🛡 KSU: ${{ inputs.with_ksu && 'with ReSukiSU' || 'without KSU' }} (${{ inputs.ksu_ref }})
            ⏱ Build time: ${{ env.BUILD_DURATION }}
